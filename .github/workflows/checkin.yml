name: 商汤小浣熊 每日登录动作

# 云端定时模拟「桌面端登录动作」，确认当日 300 积分入账。
# 积分是否过期以客户端实测为准：账本 expire_at 字段仅作观测，不作成功判据。
# 账号体系：仓库变量 RACCOON_ACCOUNTS 里的每个标签 = 一个 Environment `acct-<标签>`，
# 环境内存放该账号专属的 RACCOON_ACCESS_TOKEN（登录令牌）、
# RACCOON_ACCOUNT_ID（内部ID尾号，防串号）、可选 RACCOON_REFRESH_TOKEN。
# 新增账号：本机双击「密码登录.bat」输入手机号+密码即可，无需改本文件、无需上网页加 Secret。

on:
  schedule:
    # UTC 16:58 = 北京时间 00:58；五个项目错峰，避开 UTC 00~02 调度高峰
    - cron: '58 16 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: '仅自检，不触发登录动作'
        required: false
        default: false
        type: boolean

# 令牌可能轮换，定时与手动必须串行，避免两轮并发互相作废
concurrency:
  group: raccoon-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare_accounts:
    name: 读取账号列表
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - name: 生成动态 matrix
        id: build
        env:
          LIST: ${{ vars.RACCOON_ACCOUNTS }}
        run: |
          items=""; n=0
          for t in $(printf '%s' "$LIST" | tr ',' ' '); do
            case "$t" in ''|*[!0-9]*) continue ;; esac
            [ "${#t}" -eq 4 ] || continue
            [ -z "$items" ] || items="$items,"
            items="$items{\"tail\":\"$t\"}"
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo 'matrix={"include":[{"tail":"none"}]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$items]}" >> "$GITHUB_OUTPUT"
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "已登记账号数：$n"

  checkin:
    name: 执行签到 · 手机号尾号${{ matrix.tail }}
    needs: prepare_accounts
    if: ${{ needs.prepare_accounts.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false            # 某账号失败不影响其他账号
      matrix: ${{ fromJson(needs.prepare_accounts.outputs.matrix) }}
    environment: acct-${{ matrix.tail }}

    env:
      # 账号专属凭据（环境级 Secret 覆盖仓库级同名 Secret）
      RACCOON_ACCESS_TOKEN: ${{ secrets.RACCOON_ACCESS_TOKEN }}
      RACCOON_REFRESH_TOKEN: ${{ secrets.RACCOON_REFRESH_TOKEN }}
      RACCOON_ACCOUNT_ID: ${{ secrets.RACCOON_ACCOUNT_ID }}
      # 可选：配置后云端每次运行用密码现取独立会话，不受桌面客户端切号影响
      RACCOON_PHONE: ${{ secrets.RACCOON_PHONE }}
      RACCOON_PASSWORD: ${{ secrets.RACCOON_PASSWORD }}
      RACCOON_ACCOUNT_LABEL: '手机号尾号${{ matrix.tail }}'
      # 通知通道（仓库级 Secret，所有账号共用；任一为空则跳过该通道）
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      WECOM_APP: ${{ secrets.WECOM_APP }}
      SUCCESS_NOTIFY: ${{ vars.SUCCESS_NOTIFY }}
      RACCOON_WARN_DAYS: '7'

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检查凭据是否已配置
        run: |
          if [ -n "$RACCOON_ACCESS_TOKEN" ] || [ -n "$RACCOON_REFRESH_TOKEN" ]; then
            echo "✓ 令牌已配置（内容不外显）"
          elif [ -n "$RACCOON_PHONE" ] && [ -n "$RACCOON_PASSWORD" ]; then
            echo "✓ 密码登录已配置（内容不外显），本次运行将现取独立会话"
          else
            echo "::error::环境 acct-${{ matrix.tail }} 未配置凭据，请在本机双击「密码登录.bat」登记该账号"
            exit 1
          fi

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 环境自检（只读）
        id: diagnose
        run: python scripts/raccoon_checkin.py --diagnose

      - name: 执行签到
        id: checkin
        if: ${{ steps.diagnose.outcome == 'success' }}
        # 手动触发且勾选「仅自检」时不产生登录动作
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.check_only }}" = "true" ]; then
            ARGS="--check-only"
          fi
          set +e
          python scripts/raccoon_checkin.py $ARGS
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: 输出运行摘要
        if: always()
        run: |
          echo "### 小浣熊签到 · 手机号尾号${{ matrix.tail }}" >> "$GITHUB_STEP_SUMMARY"
          python scripts/summarize_result.py result.json >> "$GITHUB_STEP_SUMMARY"

      - name: 企业微信通知（失败 / 令牌临期）
        if: always()
        env:
          RACCOON_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/wecom_notify.py result.json

      - name: 上传积分数据供跨账号排序
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expiry-${{ matrix.tail }}
          path: result.json
          if-no-files-found: ignore
          retention-days: 3

      - name: 回写轮换后的令牌
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ACCOUNT_TAIL: ${{ matrix.tail }}
        run: |
          [ -s raccoon-rotated.env ] || exit 0
          if [ -z "$GH_PAT" ]; then
            echo "::warning::令牌已轮换但未配置 GH_PAT Secret，请在本机运行「密码登录.bat」"
            exit 0
          fi
          while IFS='=' read -r name token; do
            [ -n "$name" ] && [ -n "$token" ] || continue
            case "$name" in RACCOON_ACCESS_TOKEN|RACCOON_REFRESH_TOKEN) ;; *) continue ;; esac
            printf '%s' "$token" | GH_TOKEN="$GH_PAT" gh secret set "$name" --env "acct-$ACCOUNT_TAIL"
            echo "✓ 已回写 $name 到环境 acct-$ACCOUNT_TAIL"
          done < raccoon-rotated.env

      - name: 失败时标记任务
        if: ${{ always() && (steps.diagnose.outcome != 'success' || steps.checkin.outcome == 'failure') }}
        run: |
          echo "::error::手机号尾号${{ matrix.tail }} 签到未成功，请查看上方日志与运行摘要"
          exit 1

  recommend:
    name: 每日积分播报 + 优先用号推荐
    needs: [prepare_accounts, checkin]
    if: ${{ always() && needs.prepare_accounts.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 每天签到完成后必推一条：每个账号的当前积分、积分开始过期的日子、
      # 以及「提前一天用掉」的具体日期。RECOMMEND_NOTIFY=0 可整体关闭。
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      WECOM_APP: ${{ secrets.WECOM_APP }}
      RECOMMEND_NOTIFY: ${{ vars.RECOMMEND_NOTIFY }}
      RACCOON_ACCOUNTS: ${{ vars.RACCOON_ACCOUNTS }}
      RACCOON_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 下载各账号积分数据
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: expiry-*
          path: _expiry

      - name: 汇总各账号积分并推送每日播报
        run: |
          python scripts/wecom_notify.py --recommend _expiry | tee _recommend.md
          cat _recommend.md >> "$GITHUB_STEP_SUMMARY"


  heartbeat:
    name: 上报成功心跳
    needs: [checkin]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping Healthchecks
        run: |
          U="${{ vars.HC_PING_URL }}"
          if [ -z "$U" ]; then
            echo "[心跳] 未配置 HC_PING_URL，跳过"
            exit 0
          fi
          if curl -fsS --max-time 15 --retry 2 "$U"; then
            echo "[心跳] 已上报成功"
          else
            echo "[心跳] 上报失败（不影响签到结果）"
          fi
